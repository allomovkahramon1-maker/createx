<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Createx</title>
</head>

<body>
    <header class="bg-[#ffc5b8] fixed top-0 left-0 w-full z-50">

        <nav class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">

            <!-- Logo -->
            <a href="index.html">
                <img src="/pages/pages/image/Navbar/logo.svg" alt="Createx logo" class="w-28 sm:w-32" />
            </a>

            <!-- Desktop links -->
            <div class="hidden lg:flex items-center gap-6 font-medium">
                <a href="about.html" class="hover:text-[#ff3f22]">About Us</a>
                <a href="courses.html" class="hover:text-[#ff3f22]">Courses</a>
                <a href="eventList.html" class="hover:text-[#ff3f22]">Events</a>
                <a href="blog.html" class="hover:text-[#ff3f22]">Blog</a>
                <a href="contact.html" class="hover:text-[#ff3f22]">Contacts</a>
            </div>

            <!-- Desktop buttons -->
            <div class="hidden lg:flex items-center gap-4">

                <a href="contact.html"
                    class="bg-[#ff3f22] text-white px-6 py-3 font-bold rounded-md hover:bg-[#e9371d]">
                    Get consultation
                </a>
                <button id="btn" class="hover:text-[#ff3f22] font-bold">
                    Log in / Register
                </button>
            </div>

            <!-- Menu button -->
            <button id="menuBtn" class="lg:hidden text-3xl">
                <span class="material-symbols-outlined hover:text-[#ff3f22]">menu</span>
            </button>

            <!-- Close button -->
            <button id="closeBtn" class="hidden lg:hidden text-3xl">
                <span class="font-bold hover:text-[#ff3f22]">x</span>
            </button>

        </nav>

        <!-- Mobile menu -->
        <div id="mobileMenu" class="hidden lg:hidden bg-[#ffc5b8] border-t border-[#f4b5a8] px-5 py-5">

            <div class="flex flex-col gap-5 font-medium">

                <a href="about.html" class="hover:text-[#ff3f22]">About Us</a>

                <a href="courses.html" class="hover:text-[#ff3f22]">Courses</a>

                <a href="eventList.html" class="hover:text-[#ff3f22]">Events</a>

                <a href="blog.html" class="hover:text-[#ff3f22]">Blog</a>

                <a href="contact.html" class="hover:text-[#ff3f22]">Contacts</a>

                <a href="contact.html"
                    class="bg-[#ff3f22] text-white text-center px-5 py-3 rounded-md hover:bg-[#e9371d]">
                    Get consultation
                </a>

            </div>
        </div>

    </header>
    <!-- main section qismlari -->
    <main>
        <section>
            <div class="max-w-6xl mx-auto">

            </div>
        </section>
    </main>
</body>

</html>

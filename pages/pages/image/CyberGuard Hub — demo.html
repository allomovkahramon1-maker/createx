add('fin','exp','Xarajat va daromad daftari','Oylik hisob va toifalar diagrammasi',b=>{let X=LS.g('exp',[]);const CT2=['Oziq-ovqat','Transport','Uy-joy','Aloqa','Kiyim','Sog’liq','Ta’lim','Ko’ngilochar','Boshqa'];b.innerHTML=`<div id="r"></div><div class="bx"><h3>Yozuv qo’shish</h3><label>Turi<select id="ty"><option value="-1">Xarajat</option><option value="1">Daromad</option></select></label><label>Toifa<select id="ct">${CT2.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Summa (so’m)<input id="sm" type="number" min="0"></label><label>Izoh<input id="nt"></label><button class="btn" id="ad">Qo’shish</button></div>`;const r=()=>{const m=new Date().toISOString().slice(0,7),M=X.filter(x=>x.d.startsWith(m)),inc=sum(M,x=>x.t>0),ex=sum(M,x=>x.t<0),by={};M.filter(x=>x.t<0).forEach(x=>by[x.c]=(by[x.c]||0)+x.s);const bb=Object.entries(by).sort((a,c)=>c[1]-a[1]).map(([k,v])=>[k,v,f(v)]);$('#r',b).innerHTML=`<div class="kp"><div class="kc"><b>${f(inc)}</b><span>Daromad (shu oy)</span></div><div class="kc"><b>${f(ex)}</b><span>Xarajat (shu oy)</span></div><div class="kc"><b>${f(inc-ex)}</b><span>Qoldiq</span></div></div><div class="bx"><h3>Xarajat toifalari</h3>${bb.length?bars(bb):'<p class="mu">Hali xarajat yo’q.</p>'}</div>`+X.slice(-8).reverse().map(x=>`<div class="li"><span>${esc(x.d)} · ${esc(x.c)} ${esc(x.n||'')}</span><span><b class="${x.t<0?'bad':'ok'}">${x.t<0?'−':'+'}${f(x.s)}</b> <button class="gh" data-x="${X.indexOf(x)}" aria-label="O’chirish">×</button></span></div>`).join('')};$('#ad',b).onclick=()=>{const s=parseFloat($('#sm',b).value);if(!(s>0))return;X.push({d:new Date().toISOString().slice(0,10),t:+$('#ty',b).value,c:$('#ct',b).value,s,n:$('#nt',b).value});LS.s('exp',X);$('#sm',b).value='';$('#nt',b).value='';r()};b.onclick=e=>{const i=e.target.dataset.x;if(i!==undefined){X.splice(+i,1);LS.s('exp',X);r()}};r()});

add('sec','exif','Rasm maxfiyligi (GPS/EXIF tozalash)','Rasm qayta kodlanadi, joylashuv va qurilma ma’lumoti o’chadi',b=>{b.innerHTML='<label>Rasm<input type="file" accept="image/jpeg,image/png,image/webp"></label><div class="out"></div><p class="mu">Rasm qurilmadan chiqmaydi. Telefon suratlarida joylashuv (GPS), vaqt va qurilma modeli yashirin saqlanadi; tozalangan nusxada ular bo’lmaydi.</p>';$('input',b).onchange=async e=>{const x=e.target.files[0];if(!x)return;try{const bm=await createImageBitmap(x),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);const ty=x.type==='image/png'?'image/png':'image/jpeg',bl=await new Promise(r=>c.toBlob(r,ty,.92)),u=URL.createObjectURL(bl);$('.out',b).innerHTML=`<img src="${u}" alt="Tozalangan rasm" style="max-width:100%;border-radius:12px"><div class="li"><span>Asl hajm</span><b>${f(x.size/1024)} KB</b></div><div class="li"><span>Tozalangan hajm</span><b>${f(bl.size/1024)} KB</b></div><a class="btn" download="tozalangan.${ty==='image/png'?'png':'jpg'}" href="${u}">Yuklab olish</a>`}catch{$('.out',b).textContent='Rasmni o’qib bo’lmadi'}}});
add('sec','totp','2FA kod hisoblagich (TOTP)','Maxfiy kalitdan 6 xonali kod; hech narsa saqlanmaydi',b=>{b.innerHTML='<label>Maxfiy kalit (base32)<input id="k" autocomplete="off" placeholder="JBSW Y3DP EHPK 3PXP"></label><div class="num out" style="font-size:44px;letter-spacing:6px">——</div><div class="mu" id="t"></div><p class="mu">Kalitni faqat o’zingizning hisobingiz uchun kiriting. Sahifa kalitni saqlamaydi va yubormaydi.</p>';const run=async()=>{if(!b.isConnected)return clearInterval(iv);const k=$('#k',b).value;const left=30-Math.floor(Date.now()/1000)%30;$('#t',b).textContent=k?`${left} soniyadan keyin yangilanadi`:'';try{$('.out',b).textContent=k.replace(/[^A-Za-z2-7]/g,'').length>=8?await totp(k):'——'}catch{$('.out',b).textContent='——'}};const iv=setInterval(run,1000);b.oninput=run});
add('day','bak','Zaxira nusxa (eksport/import)','Barcha shaxsiy ma’lumotlarni saqlash va tiklash',b=>{b.innerHTML='<button class="btn" id="ex">Eksport (JSON)</button> <button class="gh" id="cp">Nusxalash</button><pre class="out" style="max-height:160px;overflow:auto"></pre><label>Import: JSON matnini joylang<textarea id="im" rows="4"></textarea></label><button class="gh" id="in">Tiklash</button> <button class="gh" id="cl">Hammasini o’chirish</button><p class="mu">Zaxira kartalar nomi, qaydlar, xarajatlar va murojaatlarni o’z ichiga oladi: xavfsiz joyda saqlang.</p>';const dump=()=>{const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('cg.'))o[k]=localStorage.getItem(k)}}catch{}return JSON.stringify(o,null,1)};$('#ex',b).onclick=()=>{const t=dump();$('.out',b).textContent=t;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='cyberguard-zaxira.json';a.click()}catch{}};$('#cp',b).onclick=()=>copy(dump());$('#in',b).onclick=()=>{try{const o=JSON.parse($('#im',b).value);const k=Object.keys(o).filter(x=>x.startsWith('cg.'));if(!k.length)throw 0;k.forEach(x=>localStorage.setItem(x,String(o[x])));alert(k.length+' ta yozuv tiklandi. Sahifani yangilang.')}catch{alert('JSON noto’g’ri')}};$('#cl',b).onclick=()=>{if(confirm('Barcha shaxsiy ma’lumotlar o’chiriladi. Davom etasizmi?')){Object.keys(localStorage).filter(k=>k.startsWith('cg.')).forEach(k=>localStorage.removeItem(k));alert('O’chirildi. Sahifani yangilang.')}}});
// ---- UI
const FT=[['home','Bosh sahifa','◧',[]],
['sec','Xavfsizlik','⬡',[['Tekshiruvlar',['url','msg','apk','fh']],['Parol va shifrlash',['pw','pws','pin','uid','enc','totp']],['Maxfiylik',['exif']],['Kodlash va xesh',['h256','h512','h1','b64e','b64d','ue','ud','jwt']],['Shaxsiy reja',['chk']]]],
['cyb','Kiberjinoyat','⚑',[['Ogohlik',['guide','quiz','word']],['Pul yechildi',['sos','rec']],['Murojaat va jurnal',['app','log']]]],
['card','Plastik kartalar','▤',[['Kartalarim',['cards']],['Tekshiruv va himoya',['bin','blk','cs']]]],
['cur','Valyuta','¤',[['Konvertor',['fx']]]],
['bank','Banklar uchun','◈',[['Mijozlar bilan ishlash',['bwarn','bscr']],['Hodisaga javob',['bres','brep']],['Nazorat va ko’rsatkichlar',['baud','bkpi']]]],
['phone','Telefon uchun','▭',[['Telefon himoyasi',['pchk','pand','pios']],['SIM va qo’ng’iroqlar',['psim','pcall']],['Raqam va havolalar',['pnum','plnk']]]],
['fin','Moliya','◫',[['Omonat va foiz',['dep','cmp','infl','goal','cagr','r72']],['Kredit',['ann','dif','inst','early','aff']],['Biznes',['vat','roi','mar','be','sal']],['Kundalik byudjet',['pc','chg','split','b532','fuel']],['Hisob daftarlari',['exp','sub']]]],
['con','Aloqa va murojaat','☏',[['Qisqa raqamlar',['nums','voice']],['Murojaat',['app','log','trk']],['Ro’yxat va havolalar',['reg','set']]]],
['ai','AI yordamchi','✳',[['Suhbat',['ai']]]],
['day','Kundalik','▦',[['Matn',['nw','l2c','c2l','wc','up','lo','srt','ddp','js']],['Sana va vaqt',['dd','wt','tm']],['Salomatlik va tasodif',['bmi','rn']],['Qaydlar',['nt','td']],['Birliklar',['u1','u2','u3','u4','u5','u6','u7','tmp']],['Ma’lumotlarim',['bak']]]]];
const byId=Object.fromEntries(T.map(t=>[t.id,t])),CTN=Object.fromEntries(FT.map(s=>[s[0],s[1]]));let cur='home';
const donut=(p,l)=>{const r=42,c=2*Math.PI*r;return `<svg class="dn" viewBox="0 0 120 120" role="img" aria-label="${l}: ${p}%"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--ln)" stroke-width="14"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--ac)" stroke-width="14" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" fill="var(--fg)" font-size="22" font-weight="700">${p}%</text></svg>`};
const bars=d=>{const m=Math.max(...d.map(x=>x[1]),1);return d.map(([l,v,t])=>`<div class="br"><span>${esc(l)}</span><i style="width:${v/m*100}%"></i><b>${esc(t)}</b></div>`).join('')};
const line=d=>{const W=300,H=90,x=i=>8+i*(W-16)/(d.length-1),y=v=>H-8-v*(H-16)/100,P=d.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');return `<svg class="ln" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Xavfsizlik bali dinamikasi"><path d="${P} L${x(d.length-1)} ${H-8} L8 ${H-8}Z" fill="var(--ac)" opacity=".12"/><path class="l" d="${P}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
const cu=()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;document.querySelectorAll('.kc b').forEach(el=>{const t=el.textContent,m=t.match(/\d[\d ]*/);if(!m)return;const n=parseInt(m[0].replace(/ /g,''));if(!n||n>1e7)return;const t0=performance.now();const st=now=>{const k=Math.min(1,(now-t0)/900);el.textContent=t.replace(m[0],f(Math.round(n*(1-Math.pow(1-k,3)))));if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)})};
const pct=(o,n)=>Math.round(Object.values(o).filter(Boolean).length/n*100);
const kc=(v,l,s)=>`<div class="kc"><b>${v}</b><span>${l}</span><small>${s}</small></div>`;
const dash=()=>{const ck=pct(LS.g('chk',{}),12),sp=pct(LS.g('sos',{}),7),cd=LS.g('cards',[]).length,td=LS.g('todo',[]),lg=LS.g('log',[]).length,qz=LS.g('quiz',0),u=LS.g('use',{}),R=LS.g('rates',{}),hs=LS.g('hist',[]),mo=new Date().toISOString().slice(0,7),ex=LS.g('exp',[]).filter(x=>x.t<0&&x.d.startsWith(mo)).reduce((a,x)=>a+x.s,0),tk=LS.g('trk',[]).length;
const ub=Object.entries(u).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[CTN[k]||k,v,String(v)]),rb=Object.entries(R).filter(([,v])=>v).map(([k,v])=>[k,v,f(v)]);
const q=(id,t)=>`<button class="gh" data-id="${id}">${t}</button> `;
return `<div class="crumb">CyberGuard Hub</div><h2>Bosh sahifa</h2><p class="mu">Kiberjinoyat bo’yicha rasmiy ko’rsatkichlar (IIV ma’lumotlari, ommaviy axborot vositalari orqali) va sizning shaxsiy holatingiz.</p>
<h3 class="sh">Kiberjinoyat — mamlakat bo’yicha</h3><div class="kp">${kc('69 962','IT orqali sodir etilgan jinoyat','2026-yil yanvar–sentyabr · IIV, daryo.uz')}${kc('&gt;1 trln so’m','fuqarolar ko’rgan zarar','2026-yil 9 oy · IIV, zamin.uz')}${kc('≈50%','zararli APK orqali sodir etilgan','IIV vakili, anhor.uz')}${kc('9 282','fosh etilgan kiberjinoyat','2026-yil 1-yarim · IIV, spot.uz')}</div>
<div class="g2c"><div class="bx"><h3>Zararli APK ulushi</h3>${donut(50,'Zararli APK ulushi (taxminan)')}<p class="mu">“Qariyb yarmi” — taxminiy ko’rsatkich. APK’ni faqat rasmiy do’kondan o’rnating.</p></div><div class="bx"><h3>Yetkazilgan zarar (trln so’m)</h3>${bars([['2025 (12 oy)',1.9,'1,9'],['2026 (9 oy)',1.0,'>1,0']])}<p class="mu">Davrlar har xil: 2026 ko’rsatkichi hali to’liq yil emas. Manba: IIV, spot.uz, zamin.uz.</p></div></div>
<h3 class="sh">Mening ko’rsatkichlarim</h3><div class="kp">${kc(ck+'%','Xavfsizlik tekshiruvi','12 banddan bajarilgani')}${kc(sp+'%','SOS reja tayyorgarligi','7 qadamdan bajarilgani')}${kc(cd,'Saqlangan kartalar','Faqat nom va oxirgi 4 raqam')}${kc(qz+'/5','Firibgarlik testi','Eng yaxshi natija')}${kc(td.filter(x=>x.d).length+'/'+td.length,'Vazifalar','Bajarilgan / jami')}${kc(lg,'Hodisalar jurnali','Yozuvlar soni')}${kc(f(ex),'Shu oy xarajat','so’m · daftardan')}${kc(tk,'Murojaatlar','Kuzatuvda')}</div>
<div class="g2c"><div class="bx"><h3>Xavfsizlik tekshiruvi</h3>${donut(ck,'Xavfsizlik tekshiruvi')}${q('chk','Rejani ochish')}</div><div class="bx"><h3>Xavfsizlik bali dinamikasi</h3>${hs.length>1?line(hs):'<p class="mu">Xavfsizlik tekshiruvida bandlarni belgilasangiz, grafik paydo bo’ladi.</p>'}</div><div class="bx"><h3>Bo’limlar bo’yicha faoliyat</h3>${ub.length?bars(ub):'<p class="mu">Asboblardan foydalansangiz, shu yerda diagramma paydo bo’ladi.</p>'}</div><div class="bx"><h3>Valyuta kurslari (so’m)</h3>${rb.length?bars(rb):'<p class="mu">Kurslar hali yuklanmagan.</p>'}${q('fx','Konvertorni ochish')}</div></div>
<h3 class="sh">Tezkor</h3>${q('sos','SOS reja')}${q('url','Havolani tekshir')}${q('msg','SMS tekshir')}${q('nums','Qisqa raqamlar')}${q('exp','Xarajat daftari')}${q('totp','2FA kod')}${q('bwarn','Banklar uchun')}${q('pchk','Telefon uchun')}${q('app','Murojaat yozish')}${q('ai','AI’dan so’ra')}`};
const secV=s=>`<div class="crumb"><a href="#home">Bosh sahifa</a> / ${s[1]}</div><h2>${s[1]}</h2><p class="mu">${s[3].length} papka · ${new Set(s[3].flatMap(f=>f[1])).size} asbob</p><div class="fg">`+s[3].map(f=>`<section class="fd"><span class="tab"></span><h3>${f[0]} <small>${f[1].length}</small></h3>`+f[1].map(id=>`<button class="tl" data-id="${id}"><b>${byId[id].n}</b><span>${byId[id].d}</span></button>`).join('')+'</section>').join('')+'</div>';
const srch=q=>{const r=T.filter(t=>(t.n+t.d).toLowerCase().includes(q));return `<div class="crumb">Qidiruv</div><h2>“${esc(q)}” — ${r.length} natija</h2><div class="fd"><span class="tab"></span>`+(r.map(t=>`<button class="tl" data-id="${t.id}"><b>${t.n}</b><span>${CTN[t.c==='conv'?'day':t.c]} · ${t.d}</span></button>`).join('')||'<p class="mu">Hech narsa topilmadi.</p>')+'</div>'};
const nav=()=>{$('#nav').innerHTML=FT.map(s=>`<button class="ni ${s[0]===cur?'on':''}" data-s="${s[0]}"><i>${s[2]}</i>${s[1]}</button>`).join('')};
const go=s=>{cur=s;$('#sb').classList.remove('open');nav();const S=FT.find(x=>x[0]===s);$('#view').innerHTML=s==='home'?dash():secV(S);if(s==='home')cu();scrollTo(0,0);history.replaceState(null,'','#'+(s==='home'?'home':'s-'+s))};
const open=id=>{const t=byId[id];if(!t)return;const u=LS.g('use',{}),k=t.c==='conv'?'day':t.c;u[k]=(u[k]||0)+1;LS.s('use',u);$('#pt').textContent=t.n;$('#pd').textContent=t.d;const o=$('#pb'),b=document.createElement('div');b.id='pb';o.replaceWith(b);t.r(b);$('#panel').classList.add('open');$('#panel').scrollTop=0};
const close=()=>{$('#panel').classList.remove('open');go(cur)};
const links=()=>{const s=(i,h)=>{const a=$(i);a.href=h||'#';a.onclick=h?null:e=>{e.preventDefault();open('set')}};s('#gtg',CFG.tg&&'https://t.me/'+CFG.tg);s('#gig',CFG.ig&&'https://instagram.com/'+CFG.ig);s('#gsm',CFG.sms&&'sms:'+CFG.sms);s('#gtg2',CFG.tg&&'https://t.me/'+CFG.tg);s('#gig2',CFG.ig&&'https://instagram.com/'+CFG.ig);s('#gsm2',CFG.sms&&'sms:'+CFG.sms)};
$('#nav').onclick=e=>{const b=e.target.closest('.ni');if(b){$('#q').value='';go(b.dataset.s)}};
$('#view').onclick=e=>{const t=e.target.closest('[data-id]');if(t)open(t.dataset.id)};
$('#back').onclick=close;$('#mb').onclick=()=>$('#sb').classList.toggle('open');
$('#q').oninput=e=>{const q=e.target.value.trim().toLowerCase();if(q)$('#view').innerHTML=srch(q);else go(cur)};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();$('#q').focus()}if(e.key==='Escape'&&$('#panel').classList.contains('open'))close()});
$('#th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light';LS.s('th',r.dataset.theme)};
if(LS.g('th',0))document.documentElement.dataset.theme=LS.g('th');
links();const hs=location.hash.slice(1);if(byId[hs]){go('home');open(hs)}else if(hs.startsWith('s-')&&FT.some(x=>'s-'+x[0]===hs))go(hs.slice(2));else go('home');
addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(byId[x])open(x);else if(x==='home')go('home');else if(x.startsWith('s-')&&FT.some(s=>'s-'+s[0]===x))go(x.slice(2))});
</script>
